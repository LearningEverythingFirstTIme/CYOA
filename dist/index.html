<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYOA Platform - Interactive Stories</title>
  <link rel="stylesheet" href="themes/base.css">
  <style>
    .story-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .story-card-preview {
      background: var(--color-bg-alt);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .story-card-preview:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border-color: var(--color-primary);
    }
    .story-card-preview h3 {
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }
    .story-meta {
      font-size: 0.85rem;
      color: var(--color-text-dim);
      margin-top: 1rem;
    }
    .story-stats {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
      font-size: 0.8rem;
    }
    .stat {
      background: rgba(255,255,255,0.05);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
    .loading, .error {
      text-align: center;
      padding: 3rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>CYOA Platform</h1>
      <div class="subtitle">Interactive Fiction Stories</div>
    </header>
    
    <main id="story-list">
      <div class="loading">Loading stories...</div>
    </main>
  </div>

  <script>
    async function loadStories() {
      const container = document.getElementById('story-list');
      
      try {
        const response = await fetch('stories/index.json');
        if (!response.ok) throw new Error('Failed to load story index');
        
        const data = await response.json();
        
        if (data.stories.length === 0) {
          container.innerHTML = '<div class="error">No stories found.</div>';
          return;
        }
        
        container.innerHTML = '<div class="story-grid">' + 
          data.stories.map(story => `
            <a href="index.html?story=${story.id}" class="story-card-preview">
              <h3>${escapeHtml(story.title)}</h3>
              <p>${escapeHtml(story.description || 'No description')}</p>
              <div class="story-meta">
                ${story.author ? `By ${escapeHtml(story.author)}` : ''}
                ${story.theme ? `• Theme: ${escapeHtml(story.theme)}` : ''}
              </div>
              <div class="story-stats">
                <span class="stat">${story.stats?.totalNodes || '?'} nodes</span>
                <span class="stat">${story.stats?.endings || '?'} endings</span>
              </div>
            </a>
          `).join('') + 
        '</div>';
        
      } catch (err) {
        container.innerHTML = `<div class="error">
          <h2>Error Loading Stories</h2>
          <p>${err.message}</p>
        </div>`;
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    loadStories();
  </script>
</body>
</html>
